<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: html(~{::content})}">

<head>
    <title>Reportes</title>
</head>

<body>

    <div th:fragment="content">
        <div
            class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2">Reportes y Estadísticas</h1>
            <div class="btn-toolbar mb-2 mb-md-0">
                <div class="btn-group me-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary">Compartir</button>
                    <button type="button" class="btn btn-sm btn-outline-secondary">Exportar</button>
                </div>
                <button type="button" class="btn btn-sm btn-outline-secondary dropdown-toggle">
                    <i class="fa-solid fa-calendar"></i> Esta semana
                </button>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">Trámites por Tipo</h5>
                    </div>
                    <div class="card-body d-flex align-items-center justify-content-center">
                        <p class="text-muted">Gráfico de torta en construcción...</p>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">Evolución Mensual</h5>
                    </div>
                    <div class="card-body d-flex align-items-center justify-content-center">
                        <p class="text-muted">Gráfico de barras en construcción...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
